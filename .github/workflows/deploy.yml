name: Deploy via SFTP

# Runs whenever main is updated — whether by a direct push or a merged pull request.
# A merged PR produces a push event on main, so a single push trigger covers both cases.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload site files over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './*'
          remote_path: ${{ vars.SFTP_REMOTE_PATH }}
          sftp_only: true

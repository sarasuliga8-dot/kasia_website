
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <title>Kasia Suliga | Digital Strategy &amp; EdTech Leadership</title>

    <!-- Website icon -->
    
    <link
        rel="icon"
        type="image/jpeg"
        href="{{ url_for('static', filename='profile_photo.jpg') }}?v=2"
    >


    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Lora:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Work+Sans:wght@300;400;500;600&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Main stylesheet -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <!-- Shared navigation -->
    <header class="site-nav">
        <div class="nav-inner">

            <a class="nav-brand" href="{{ url_for('home') }}">
                Katarzyna (Kasia) Suliga Wasielewska
            </a>

            <button
                class="nav-toggle"
                id="navToggle"
                aria-label="Toggle navigation"
                aria-expanded="false"
                aria-controls="navLinks"
                type="button"
            >
                &#9776;
            </button>

            <ul class="nav-links" id="navLinks">
                <li><a href="{{ url_for('about') }}"{% if request.endpoint == 'about' %} class="active"{% endif %}>About Me</a></li>
                <li><a href="{{ url_for('working_together') }}"{% if request.endpoint == 'working_together' %} class="active"{% endif %}>Working Together</a></li>
                <li><a href="{{ url_for('contact') }}"{% if request.endpoint == 'contact' %} class="active"{% endif %}>Let's Connect</a></li>
            </ul>

        </div>
    </header>

    <!-- Page-specific content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Shared footer -->
    <footer>
        &copy; 2026 Kasia Suliga. All rights reserved.
    </footer>

    <!-- Main JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
